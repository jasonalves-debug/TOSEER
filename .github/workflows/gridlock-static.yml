name: GRIDLOCK weekly data

on:
  schedule:
    - cron: '17 8 * * 1'   # Mondays 08:17 UTC: TTC/GO schedules, schools, towers, construction, worship, neighbourhoods
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build GRIDLOCK weekly data
        run: python scripts/build_gridlock_feed.py static
        env:
          ONTARIO511_KEY: ${{ secrets.ONTARIO511_KEY }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/gridlock_static.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "GRIDLOCK weekly data $(date -u +'%Y-%m-%d')"
          for i in 1 2 3; do git pull --no-rebase --no-edit && git push && exit 0; sleep 5; done
          exit 1
