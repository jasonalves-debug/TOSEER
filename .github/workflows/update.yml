name: Update emergency data

# GitHub's scheduler only fires '*/15' every few hours in practice, so each run keeps itself busy:
# it updates every 15 minutes for about 5.5 hours. The schedule and the concurrency queue start the next
# run as soon as one finishes, so the data stays fresh around the clock.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false   # one run at a time; the next one waits its turn

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update every 15 minutes (22 rounds, about 5.5 hours)
        env:
          ONTARIO511_KEY: ${{ secrets.ONTARIO511_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for round in $(seq 1 22); do
            started=$(date +%s)
            git pull --rebase --quiet || true
            python scripts/update_data.py || echo "::warning::incidents update failed"   # TPS + TFS → incidents.json
            python scripts/fetch_road_restrictions.py || true                             # City road restrictions
            python scripts/build_gridlock_feed.py live || true                            # GRIDLOCK game feed
            python scripts/fetch_news.py || true                                          # news + politician mentions
            git add docs/data/incidents.json docs/data/geocode_cache.json docs/data/history_stats.json \
                    docs/data/road_restrictions.json docs/data/road_geocode_cache.json \
                    docs/data/news.json docs/data/news_geocode_cache.json 2>/dev/null || true
            git add docs/data/gridlock_live.json docs/data/gridlock_cache.json 2>/dev/null || true
            if ! git diff --staged --quiet; then
              git commit --quiet -m "Update data $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              git pull --rebase --quiet && git push --quiet || echo "::warning::push failed, will retry next round"
            fi
            if [ "$round" -lt 22 ]; then
              wait=$(( 900 - ($(date +%s) - started) )); [ "$wait" -gt 0 ] && sleep "$wait"
            fi
          done
